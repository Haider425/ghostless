# Companies to track. Run `ghostless verify` after editing.
#
# Every source below was checked on 2026-10-17. Boards move, so rerun
# verify now and then; CONTRIBUTING.md explains how to fix FAIL and WARN.
#
# Fields: name, platform, slug, and optional `region` (used only for sources
# that do not publish job locations) and `domain` (the company's website,
# used to show its logo on the site).
#
# Finding a new company's platform and slug: open its careers page, click into
# any job (or its Apply button) and read the URL:
#   boards.greenhouse.io/<slug>, job-boards.greenhouse.io/<slug>  -> greenhouse
#   jobs.lever.co/<slug>                                          -> lever
#   jobs.ashbyhq.com/<slug>                                       -> ashby
#   <tenant>.wdN.myworkdayjobs.com/<locale>/<Site>                -> workday
#       slug = "<tenant>.wdN.myworkdayjobs.com/<Site>"  (drop the en-US part)
#
# Meta is intentionally absent: metacareers.com's robots.txt prohibits
# automated collection without written permission.

companies:
  # ---- Big tech ----
  - name: Amazon
    domain: amazon.com
    platform: amazon
    slug: "normalized_country_code[]=CAN"
  - name: Microsoft
    domain: microsoft.com
    platform: eightfold  # rate limits aggressively; paced at one request per 2s
    slug: "apply.careers.microsoft.com/microsoft.com?location=Canada"
  - name: Google
    domain: google.com
    platform: google   # first results page per search only (robots.txt)
    slug: "location=Canada&q=software|location=Canada&q=data|location=Canada&q=intern|location=Canada&q=engineer"
    region: Canada
  - name: Apple
    domain: apple.com
    platform: apple    # short summaries only: full job pages need JavaScript
    slug: "en-ca/search?location=canada-CANC"
    region: Canada
  - name: Shopify
    domain: shopify.com
    platform: sitemap  # sitemap lists titles and links only
    slug: "https://www.shopify.com/careers/sitemap.xml"
    region: "Remote - Americas (assumed; Shopify is remote first)"
  - { name: Nvidia,      platform: workday, slug: nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite, domain: nvidia.com }
  - { name: Salesforce,  platform: workday, slug: salesforce.wd12.myworkdayjobs.com/External_Career_Site, domain: salesforce.com }
  - { name: Adobe,       platform: workday, slug: adobe.wd5.myworkdayjobs.com/external_experienced, domain: adobe.com }
  - { name: Intel,       platform: workday, slug: intel.wd1.myworkdayjobs.com/External, domain: intel.com }
  - { name: Workday,     platform: workday, slug: workday.wd5.myworkdayjobs.com/Workday, domain: workday.com }

  # ---- Canadian banks, insurers and finance ----
  - { name: TD,          platform: workday, slug: td.wd3.myworkdayjobs.com/TD_Bank_Careers, domain: td.com }
  - { name: RBC,         platform: workday, slug: rbc.wd3.myworkdayjobs.com/RBCGLOBAL1, domain: rbc.com }
  - { name: BMO,         platform: workday, slug: bmo.wd3.myworkdayjobs.com/External, domain: bmo.com }
  - { name: CIBC,        platform: workday, slug: cibc.wd3.myworkdayjobs.com/search, domain: cibc.com }
  - name: Scotiabank
    domain: scotiabank.com
    platform: rss
    slug: "https://jobs.scotiabank.com/sitemap.xml"
  - { name: Manulife,    platform: workday, slug: manulife.wd3.myworkdayjobs.com/MFCJH_Jobs, domain: manulife.com }
  - { name: Sun Life,    platform: workday, slug: sunlife.wd3.myworkdayjobs.com/Experienced-Jobs, domain: sunlife.ca }
  - { name: Mastercard,  platform: workday, slug: mastercard.wd1.myworkdayjobs.com/CorporateCareers, domain: mastercard.com }
