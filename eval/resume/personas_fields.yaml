# More synthetic resumes, outside tech (docs/resume-model-plan.md, stage 1).
#
# Same rules as personas.yaml: every person is invented (example.com emails,
# 555 numbers). Twelve fields, five people each: a student or new grad, a
# mid-career and a senior person who stay in their field (target role
# "other": Ghostless lists tech jobs, so almost every posting should be weak
# for them), and one or two moving into tech, whose earlier work partly
# transfers. `field` is the person's field, for checking that a model can tell
# fields apart. `pairs` is how many postings to label for them.

