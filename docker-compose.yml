services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Run the tracker without installing Python:
  #   docker compose run --rm tracker verify
  #   docker compose run --rm tracker ingest
  tracker:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker
      JOB_TRACKER_CONTACT: ${JOB_TRACKER_CONTACT:-}
    volumes:
      - ./companies.yaml:/app/companies.yaml:ro

volumes:
  pgdata:
