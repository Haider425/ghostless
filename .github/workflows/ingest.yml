name: Daily ingest

on:
  schedule:
    - cron: "17 10 * * *"   # every day around 6am Toronto time
  workflow_dispatch:        # run it by hand from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: jobtracker ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}  # your Neon / Supabase URL, as a repo secret
          JOB_TRACKER_CONTACT: https://github.com/${{ github.repository }}
