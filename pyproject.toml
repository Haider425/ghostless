[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-tracker"
dynamic = ["version"]
description = "A daily pipeline that tracks tech job postings across 50+ company career sites."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Haider Saleem" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]
keywords = ["jobs", "data-pipeline", "postgresql", "scraping", "careers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jobtracker = "tracker.cli:main"

[project.urls]
Homepage = "https://github.com/Haider425/job-market-tracker"
Issues = "https://github.com/Haider425/job-market-tracker/issues"

[tool.setuptools.dynamic]
version = { attr = "tracker.__version__" }

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
