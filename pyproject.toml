[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostless"
dynamic = ["version"]
description = "Honest job data for Canadian tech students: real postings, true dates, and ghost job signals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Haider Saleem" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]
keywords = ["jobs", "data-pipeline", "postgresql", "scraping", "careers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg-pool>=3.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]
ai = ["anthropic>=1.0"]
# Only for the monthly discover workflow (Common Crawl index seeding); never
# needed by ingest or the API
index = ["pyarrow>=17"]
# Only for reading scanned resumes in the evaluation set (tracker/resume/ocr.py);
# never needed by ingest or the API
ocr = ["rapidocr-onnxruntime>=1.4", "pypdfium2>=4.30"]
dev = ["ghostless[api,ai]", "pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
ghostless = "tracker.cli:main"

[project.urls]
Homepage = "https://github.com/Haider425/ghostless"
Issues = "https://github.com/Haider425/ghostless/issues"

[tool.setuptools.dynamic]
version = { attr = "tracker.__version__" }

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
